# Observations (the fact layer).
#
# Key: relationship × situation = 9 × 6 = 54 buckets.
#
# Every entry has to survive the rules of its own layer — `make lint` runs
# them. That is stricter than it sounds: "again", "as usual" and "typical"
# are flagged, so is every adjective about a person. What is left is what a
# camera could have recorded, which is the point.

min_per_bucket: 2

entries:
