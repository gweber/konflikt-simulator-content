# Impact (the I-statement layer).
#
# Key: situation × state = 6 × 6 = 36 buckets.
#
# Decoupled from the relationship on purpose: how something lands depends on
# what happened and on the state you are in — not on who you are talking to.
# The tone is what the relationship changes, and that is handled elsewhere.
#
# Every entry names a feeling. The absence check in the impact layer would
# otherwise flag it, and rightly so: without a feeling this layer says
# nothing the other side could not have worked out themselves.

min_per_bucket: 2

entries:
  # ── reliability_deadlines ─────────────────────────────────────────────
  - { situation: reliability_deadlines, state: calm, text: "I am uneasy about it, because I plan around what we agree." }
  - { situation: reliability_deadlines, state: calm, text: "I feel unsettled, because I had counted on the date." }
  - { situation: reliability_deadlines, state: annoyed, text: "I am annoyed, because I replanned my day twice." }
  - { situation: reliability_deadlines, state: annoyed, text: "I am irritated, because the waiting cost me an afternoon." }
  - { situation: reliability_deadlines, state: disappointed, text: "I am disappointed, because I had taken the commitment as settled." }
  - { situation: reliability_deadlines, state: disappointed, text: "I feel let down, because I had made the promise to others as well." }
  - { situation: reliability_deadlines, state: hurt, text: "I am hurt, because it looked to me as if my time counted for little." }
  - { situation: reliability_deadlines, state: hurt, text: "I feel small, because I was the one chasing it." }
  - { situation: reliability_deadlines, state: exhausted, text: "I am worn out, because I have organised around this several times." }
  - { situation: reliability_deadlines, state: exhausted, text: "I feel drained, because the chasing takes more out of me than the work." }
  - { situation: reliability_deadlines, state: angry, text: "I am angry, because I gave my word to someone else on the strength of it." }
  - { situation: reliability_deadlines, state: angry, text: "I am furious, because the delay landed on my desk to explain." }

