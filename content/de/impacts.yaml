# Wirkungen (Empfindens-Ebene) — Ich-Botschaften.
#
# Schlüssel: situation × state = 6 × 6 = 36 Fächer.
#
# Beachte die Entkopplung: Wirkungen hängen an Situation und Zustand, NICHT
# an der Beziehung. Wer sich übergangen fühlt, fühlt sich übergangen — ob
# gegenüber der Partnerin oder der Vorgesetzten. Genau diese Unabhängigkeit
# lässt den Schlüsselraum von Tausenden auf 36 schrumpfen.
#
# Jeder Eintrag wird gegen content/lexicon/impact-layer.yaml geprüft und muss
# ein Gefühlswort aus dem dortigen Vokabular enthalten.

min_per_bucket: 2

entries:
  # ── reliability_deadlines ──────────────────────────────────────────────
  - { situation: reliability_deadlines, state: calm, text: "Ich bin gelassen und trotzdem unsicher, wie ich weiterplanen soll." }
  - { situation: reliability_deadlines, state: calm, text: "Ich bin gefasst, merke aber, dass ich angespannt werde, wenn ich an den Termin denke." }
  - { situation: reliability_deadlines, state: annoyed, text: "Ich bin genervt, weil ich meinen Tag zweimal umgeplant habe." }
  - { situation: reliability_deadlines, state: annoyed, text: "Ich bin ärgerlich, weil ich mich auf die Zusage verlassen hatte." }
  - { situation: reliability_deadlines, state: disappointed, text: "Ich bin enttäuscht, weil ich fest mit der Zusage gerechnet habe." }
  - { situation: reliability_deadlines, state: disappointed, text: "Ich bin enttäuscht und frage mich, worauf ich mich noch verlassen kann." }
  - { situation: reliability_deadlines, state: hurt, text: "Ich bin verletzt, weil ich mir damit nicht wichtig genug vorkomme." }
  - { situation: reliability_deadlines, state: hurt, text: "Ich fühle mich übergangen, und das trifft mich mehr, als ich erwartet hätte." }
  - { situation: reliability_deadlines, state: exhausted, text: "Ich bin erschöpft, weil ich das Nachhalten übernehme." }
  - { situation: reliability_deadlines, state: exhausted, text: "Ich bin müde davon, an Abmachungen zu erinnern." }
  - { situation: reliability_deadlines, state: angry, text: "Ich bin wütend, weil ich meine Zeit danach ausgerichtet habe." }
  - { situation: reliability_deadlines, state: angry, text: "Ich bin wütend und gleichzeitig ratlos, wie wir das lösen." }

  # ── criticism_feedback ─────────────────────────────────────────────────
  - { situation: criticism_feedback, state: calm, text: "Ich bin ruhig und trotzdem unsicher, wie die Rückmeldung gemeint war." }
  - { situation: criticism_feedback, state: calm, text: "Ich bin gefasst und zugleich unruhig, weil ich die Formulierung nicht einordnen kann." }
  - { situation: criticism_feedback, state: annoyed, text: "Ich bin genervt, weil die Kritik ohne konkrete Punkte kam." }
  - { situation: criticism_feedback, state: annoyed, text: "Ich bin ärgerlich, weil das vor anderen gefallen ist." }
  - { situation: criticism_feedback, state: disappointed, text: "Ich bin enttäuscht, weil ich mir eine Rückmeldung unter vier Augen gewünscht hätte." }
  - { situation: criticism_feedback, state: disappointed, text: "Ich bin enttäuscht, weil die Arbeit daran nicht vorkam." }
  - { situation: criticism_feedback, state: hurt, text: "Ich bin verletzt, weil das vor der ganzen Runde gefallen ist." }
  - { situation: criticism_feedback, state: hurt, text: "Ich fühle mich kleingemacht und brauche einen Moment, um zu antworten." }
  - { situation: criticism_feedback, state: exhausted, text: "Ich bin erschöpft, weil ich mich innerlich schon auf die nächste Kritik einstelle." }
  - { situation: criticism_feedback, state: exhausted, text: "Ich bin müde und merke, wie wenig Kraft ich für diese Diskussion habe." }
  - { situation: criticism_feedback, state: angry, text: "Ich bin wütend, weil die Form der Rückmeldung mich sprachlos zurückgelassen hat." }
  - { situation: criticism_feedback, state: angry, text: "Ich bin wütend und fassungslos über den Zeitpunkt." }

