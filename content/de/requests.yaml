# Bitten (Appell-Ebene) — positiv, konkret, überprüfbar.
#
# Schlüssel: goal × risk = 6 × 3 = 18 Fächer.
#
# Diese Schicht ist die Rückfallebene. Sie hängt nur am Ziel und an der
# Risikotoleranz — und muss deshalb für alle sechs Situationen tragen.
#
# Das ist eine harte Vorgabe an die Formulierung: Kein Eintrag hier darf
# einen Gegenstand, einen Ort oder einen Anlass nennen. "Ich erwarte, dass
# du meine Unterlagen nur mit meiner Zustimmung nimmst" stand hier einmal
# und war damit falsch — konkret genug, aber eben eine Szene. Konkret wird
# ein allgemeiner Eintrag über die Zeit und die Handlung, nicht über den
# Gegenstand: "bis Donnerstagmittag", "am selben Tag", "bevor du es tust".
#
# Szenisches gehört in den Block weiter unten.
#
# Die Einträge werden gegen content/lexicon/request-layer.yaml geprüft — und
# zwar mit der Risikostufe des Eintrags. Deshalb darf ein high-Eintrag "ab
# sofort" enthalten: bei hoher Risikotoleranz stuft der Linter Härte auf
# einen Hinweis herab, statt sie anzumahnen.

min_per_bucket: 2

entries:
  # ── understand ─────────────────────────────────────────────────────────
  - { goal: understand, risk: low, text: "Ich möchte gern verstehen, wie es dazu gekommen ist — magst du mir deine Sicht schildern?" }
  - { goal: understand, risk: low, text: "Ich bitte dich, mir zu erzählen, wie du die Situation erlebt hast." }
  - { goal: understand, risk: medium, text: "Ich bitte dich, mir bis morgen zu sagen, wie du zu der Entscheidung gekommen bist." }
  - { goal: understand, risk: medium, text: "Ich möchte, dass wir uns diese Woche zusammensetzen und die Punkte durchgehen — sagst du mir, wann es dir passt?" }
  - { goal: understand, risk: high, text: "Ich erwarte, dass du mir heute erklärst, wie du dazu gekommen bist." }
  - { goal: understand, risk: high, text: "Ich möchte von dir hören, wie du das begründest — und zwar in diesem Gespräch." }

  # ── change ─────────────────────────────────────────────────────────────
  - { goal: change, risk: low, text: "Ich wünsche mir, dass du mir beim nächsten Mal vorher Bescheid sagst, wenn es knapp wird." }
  - { goal: change, risk: low, text: "Mir würde es helfen, wenn du mich frühzeitig informierst, wenn sich etwas ändert." }
  - { goal: change, risk: medium, text: "Ich bitte dich, mir künftig bis Donnerstagmittag zu sagen, woran ich bei dir bin." }
  - { goal: change, risk: medium, text: "Ich möchte, dass du mich vor einer Zusage an Dritte einmal fragst." }
  - { goal: change, risk: high, text: "Ich erwarte, dass du mich ab sofort am selben Tag informierst, wenn sich etwas ändert." }
  - { goal: change, risk: high, text: "Ich will, dass du dich bis Freitag an das hältst, was wir vereinbart haben." }

  # ── set_boundary ───────────────────────────────────────────────────────
  - { goal: set_boundary, risk: low, text: "Ich möchte dich bitten, mich vorher zu fragen, bevor du darüber entscheidest." }
  - { goal: set_boundary, risk: low, text: "Mir ist wichtig, dass wir das vorher miteinander klären." }
  - { goal: set_boundary, risk: medium, text: "Ich bitte dich, mich vorher zu fragen und meine Antwort abzuwarten." }
  - { goal: set_boundary, risk: medium, text: "Ich möchte, dass du mir sagst, wenn du etwas anders machen willst, bevor du es tust." }
  - { goal: set_boundary, risk: high, text: "Ich erwarte, dass du dich an das hältst, was ich dir gerade gesagt habe." }
  - { goal: set_boundary, risk: high, text: "Ich sage es klar: Hier verläuft meine Grenze. Ich erwarte, dass du sie einhältst." }

  # ── seek_solution ──────────────────────────────────────────────────────
  - { goal: seek_solution, risk: low, text: "Ich würde gern mit dir überlegen, wie wir das nächste Mal planen — hast du diese Woche eine halbe Stunde?" }
  - { goal: seek_solution, risk: low, text: "Mir wäre wichtig, dass wir gemeinsam eine Regel dafür festlegen." }
  - { goal: seek_solution, risk: medium, text: "Ich schlage vor, dass wir bis Freitag eine feste Reihenfolge abstimmen und sie notieren." }
  - { goal: seek_solution, risk: medium, text: "Ich bitte dich, mit mir einen Weg zu besprechen, wie wir künftig damit umgehen." }
  - { goal: seek_solution, risk: high, text: "Ich möchte, dass wir das heute klären und am Ende eine schriftliche Abmachung haben." }
  - { goal: seek_solution, risk: high, text: "Ich erwarte, dass wir bis Montag eine verbindliche Regelung festhalten, die beide mittragen." }

  # ── express_feeling ────────────────────────────────────────────────────
  - { goal: express_feeling, risk: low, text: "Mir ist wichtig, dass du weißt, wie es bei mir angekommen ist — hörst du mir kurz zu?" }
  - { goal: express_feeling, risk: low, text: "Ich möchte dir schildern, was das mit mir gemacht hat, und bitte dich, mich dabei ausreden zu lassen." }
  - { goal: express_feeling, risk: medium, text: "Ich bitte dich, mir zehn Minuten zuzuhören, bevor du antwortest." }
  - { goal: express_feeling, risk: medium, text: "Ich möchte, dass du dir anhörst, was mich daran beschäftigt, und mir danach sagst, wie du es siehst." }
  - { goal: express_feeling, risk: high, text: "Ich will, dass du mir jetzt zuhörst — mir ist damit ernst." }
  - { goal: express_feeling, risk: high, text: "Ich erwarte, dass du dir das anhörst und mir danach sagst, was du damit machst." }

  # ── closure ────────────────────────────────────────────────────────────
  - { goal: closure, risk: low, text: "Ich möchte, dass wir das in Ruhe abschließen — magst du mir sagen, wie du dir das Ende vorstellst?" }
  - { goal: closure, risk: low, text: "Mir wäre wichtig, dass wir die offenen Punkte einmal gemeinsam durchgehen." }
  - { goal: closure, risk: medium, text: "Ich bitte dich, mit mir bis Ende der Woche die Übergabe zu besprechen." }
  - { goal: closure, risk: medium, text: "Ich möchte einen Termin festhalten, an dem wir das abschließen." }
  - { goal: closure, risk: high, text: "Ich möchte das hier beenden und bitte dich, mir bis Freitag zu sagen, ob du das mitträgst." }
  - { goal: closure, risk: high, text: "Ich ziehe einen Schlussstrich und erwarte, dass wir die offenen Positionen bis zum Monatsende klären." }

  # ══════════════════════════════════════════════════════════════════════
  # Szenenspezifische Bitten
  #
  # Mit `situation` versehene Einträge liegen in der verfeinerten Schicht
  # und werden bevorzugt angeboten. Die allgemeinen oben bleiben als
  # Rückfallebene und garantieren weiterhin die Abdeckung.
  #
  # Grund: Eine Bitte benennt eine Handlung, und Handlungen gehören zum
  # Anlass. Wer schildert, dass die Familie sonntags unangekündigt vor der
  # Tür stand, bekam vorher „Termine an meinen freien Tagen sprichst du
  # vorher mit mir ab“ angeboten — tadellos formuliert und an der Szene
  # vorbei. Siehe internal/corpus/corpus.go → SceneRequestKey.
  # ══════════════════════════════════════════════════════════════════════

  # ── Zuverlässigkeit & Zusagen ────────────────────────────────────────
