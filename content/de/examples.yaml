# Anlässe (Fakten-Ebene) — Belege, keine Bausteine.
#
# Diese Sätze ersetzen NICHT die Formulierung der Nutzerin. Sie werden als
# Beispiele angeboten, damit sichtbar wird, wie ein beobachtbarer Anlass
# klingt. Der Simulator arbeitet mit dem Text, den die Person selbst
# mitbringt — das Korpus zeigt den Maßstab.
#
# Schlüssel: relationship × situation = 9 × 6 = 54 Fächer.
#
# ACHTUNG: Jeder Eintrag wird beim Build gegen content/lexicon/example-layer.yaml
# geprüft. Ein Eintrag mit Zuschreibung oder Verallgemeinerung bricht `make lint`.
# Genau darin liegt der Sinn: die Doktrin gilt auch für uns.

min_per_bucket: 2

