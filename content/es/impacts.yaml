# Sentimiento (la capa del mensaje en primera persona).
#
# Clave: situation × state = 6 × 6 = 36 casillas.
#
# Desacoplado de la relación a propósito: cómo te llega algo depende de lo que
# pasó y de cómo estás, no de con quién hablas. Lo que cambia la relación es
# el tono, y eso se gestiona en otro sitio.
#
# Cada entrada nombra un sentimiento. Si no, la comprobación de ausencia de la
# capa la marcaría, y con razón.
#
# ── Geschlechtsneutral, mit Absicht ────────────────────────────────────
#
# „Estoy enfadado" oder „Estoy enfadada"? Der Korpus weiß nicht, wer
# spricht. Deshalb steht das Gefühl hier als Substantiv („siento rabia") oder
# als Verb mit Dativ („me duele", „me preocupa") — beides ist im Spanischen
# idiomatisch und braucht kein Geschlecht. Gefühlsadjektive kommen im Korpus
# nicht vor; in eigenen Sätzen erkennt das Regelwerk sie in beiden Formen.

min_per_bucket: 2

entries:
