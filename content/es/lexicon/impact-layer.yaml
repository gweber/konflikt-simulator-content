        - avergonzada
        - aliviado
        - aliviada
        - desbordado
        - desbordada
        - abrumado
        - abrumada
        - agobiado
        - agobiada
        - desanimado
        - desanimada
        - resentido
        - resentida
        - inseguro
        - insegura
