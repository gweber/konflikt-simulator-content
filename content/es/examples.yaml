# Observaciones (la capa de los hechos).
#
# Clave: relationship × situation = 9 × 6 = 54 casillas.
#
# Cada entrada tiene que superar las reglas de su propia capa — `make lint`
# las ejecuta. Es más estricto de lo que parece: «otra vez», «como siempre» y
# «típico» saltan, igual que cualquier adjetivo sobre la persona. Lo que queda
# es lo que habría grabado una cámara, y de eso se trata.
#
# Sprachliche Entscheidungen: Spanisch aus Spanien (móvil, piso, coger),
# Anrede mit tú. Wo die Szene eine Person „über" einen selbst beschreibt,
# steht sie ohne Geschlechtsmerkmal da — der Korpus weiß nicht, wer spricht.

min_per_bucket: 2

entries:
  # ── partner ───────────────────────────────────────────────────────────
