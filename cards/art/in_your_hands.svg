<!-- Two open hands (own drawing): the left holds a small sphere, your answer; the right is empty, and the other person floats above it, out of reach. -->
<defs>
  <g id="hand">
    <!-- fingers, from the base of the palm upward; the thumb to the outside -->
    <rect x="-17" y="-160" width="34" height="120" rx="17" fill="$wash2" stroke="$ink" stroke-width="7" transform="translate(-54 -40) rotate(-9)"/>
    <rect x="-17" y="-180" width="34" height="140" rx="17" fill="$wash2" stroke="$ink" stroke-width="7" transform="translate(-18 -40) rotate(-3)"/>
    <rect x="-17" y="-172" width="34" height="132" rx="17" fill="$wash2" stroke="$ink" stroke-width="7" transform="translate(18 -40) rotate(3)"/>
    <rect x="-17" y="-146" width="34" height="106" rx="17" fill="$wash2" stroke="$ink" stroke-width="7" transform="translate(54 -40) rotate(9)"/>
    <rect x="-18" y="-120" width="36" height="110" rx="18" fill="$wash2" stroke="$ink" stroke-width="7" transform="translate(-78 20) rotate(-52)"/>
    <!-- palm -->
    <path d="M -74,-40 L 74,-40 Q 82,-40 82,-32 L 82,50 Q 82,96 36,96 L -36,96 Q -82,96 -82,50 L -82,-32 Q -82,-40 -74,-40 Z" fill="$wash2" stroke="$ink" stroke-width="7" stroke-linejoin="round"/>
    <path d="M -44,-10 Q -10,60 50,30" fill="none" stroke="$line2" stroke-width="5" stroke-linecap="round"/>
  </g>
</defs>
<!-- left hand: holds the sphere -->
<use href="#hand" transform="translate(255 318) scale(0.82)"/>
<circle cx="255" cy="300" r="42" fill="$accent"/>
<circle cx="241" cy="286" r="11" fill="$wash" opacity="0.8"/>
<text x="255" y="450" text-anchor="middle" font-size="40" font-weight="700" fill="$ink">$a</text>
<!-- right hand: empty; the other person floats above it -->
<use href="#hand" transform="translate(685 318) scale(-0.82 0.82)"/>
<ellipse cx="685" cy="58" rx="200" ry="36" fill="none" stroke="$soft" stroke-width="4" stroke-dasharray="12 12"/>
<text x="685" y="72" text-anchor="middle" font-size="38" font-weight="700" fill="$soft">$b</text>
