<!-- Four ears around one sentence (own drawing; after Schulz von Thun's four-sides idea, not his graphic). -->
<defs>
  <g id="ear">
    <path d="M -8,-58 C 36,-62 60,-25 48,6 C 40,27 21,32 15,52 C 9,70 -18,72 -25,50 C -34,22 -42,-50 -8,-58 Z" fill="$wash" stroke="$accent" stroke-width="8" stroke-linejoin="round"/>
    <path d="M -6,-32 C 17,-36 28,-12 14,4 C 6,13 -2,8 -4,20" fill="none" stroke="$accent" stroke-width="7" stroke-linecap="round"/>
  </g>
</defs>
<rect x="215" y="150" width="510" height="160" rx="48" fill="#ffffff" stroke="$ink" stroke-width="6"/>
<path d="M 300,307 L 280,372 L 352,307" fill="#ffffff" stroke="$ink" stroke-width="6" stroke-linejoin="round"/>
<rect x="296" y="300" width="60" height="12" fill="#ffffff"/>
<text x="470" y="245" text-anchor="middle" font-size="40" font-weight="700" fill="$ink">$sentence</text>
<use href="#ear" transform="translate(110,80) scale(-1,1)"/>
<use href="#ear" transform="translate(830,80)"/>
<use href="#ear" transform="translate(110,300) scale(-1,1)"/>
<use href="#ear" transform="translate(830,300)"/>
<text x="110" y="190" text-anchor="middle" font-size="40" font-weight="700" fill="$accent">$fact</text>
<text x="830" y="190" text-anchor="middle" font-size="40" font-weight="700" fill="$accent">$self</text>
<text x="110" y="410" text-anchor="middle" font-size="40" font-weight="700" fill="$accent">$rel</text>
<text x="830" y="410" text-anchor="middle" font-size="40" font-weight="700" fill="$accent">$ask</text>
